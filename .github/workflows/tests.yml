name: tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  do-tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/do_tofu_version.sh valkey/scripts/aws/do_tofu

  bats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Run the suite
        run: bats valkey/scripts/tests/aws/ --recursive
